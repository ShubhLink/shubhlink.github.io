<!doctype html><html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>મનપસંદ મેસેજ | ShubhLink</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="unified.css?v=15"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><header class="sitehead"><div class="shell headwrap"><a class="brand" href="index.html"><img class="reference-logo" src="icon.svg" alt=""><span class="reference-brand-copy"><span>Shubh<b>Link</b></span><span class="reference-subtitle">GUJARATI MESSAGE HUB</span></span></a></div></header><main class="shell" style="padding:28px 0 120px"><h1>♡ તમારા મનપસંદ મેસેજ</h1><p id="empty">સાચવેલા મેસેજ અહીં દેખાશે.</p><div class="wishgrid" id="favoritesList"></div></main><nav class="mobilebottom"><a href="index.html"><span>⌂</span>હોમ</a><a href="categories.html"><span>▦</span>કેટેગરી</a><a href="ai.html"><span>✦</span>AI</a></nav><script src="share.js?v=2"></script><script>const key='shubh-favorites-v1';function render(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch{}document.getElementById('empty').hidden=a.length>0;const grid=document.getElementById('favoritesList');grid.replaceChildren();a.forEach(m=>{const card=document.createElement('article');card.className='wishitem';const h=document.createElement('h3');h.textContent=m.title;const p=document.createElement('p');p.textContent=m.body;const actions=document.createElement('div');actions.className='wish-actions';const send=document.createElement('button');send.textContent='WhatsApp પર શેર કરો';send.className='wish-whatsapp';send.onclick=()=>window.ShubhShare?.open({title:m.title,body:m.body,language:'gu',category:m.category});const remove=document.createElement('button');remove.textContent='♥ દૂર કરો';remove.onclick=()=>{localStorage.setItem(key,JSON.stringify(a.filter(x=>x.body!==m.body)));render()};actions.append(send,remove);card.append(h,p,actions);grid.append(card)})}render();</script><script src="pwa.js?v=1"></script></body></html>
