name: Optimize category photos to WebP
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/categories/*.png'
      - '.github/workflows/optimize-category-images.yml'
permissions:
  contents: write
concurrency:
  group: category-webp-optimizer
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Show source images
        run: |
          python --version
          find assets/categories -maxdepth 1 -name '*.png' | wc -l
      - name: Convert category images
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          for source in sorted(Path('assets/categories').glob('*.png')):
              target=source.with_suffix('.webp')
              with Image.open(source) as original:
                  im=ImageOps.exif_transpose(original)
                  im.thumbnail((720, 540), Image.Resampling.LANCZOS)
                  im.save(target,'WEBP',quality=78,method=6)
              clean=source.with_name(source.stem+'.clean.webp')
              with Image.open(source) as original:
                  im=ImageOps.exif_transpose(original).convert('RGB')
                  w,h=im.size
                  # Remove the printed title plaque at the bottom of existing artwork.
                  im=im.crop((int(w*.035),int(h*.055),int(w*.965),int(h*.655)))
                  im=ImageOps.fit(im,(960,640),method=Image.Resampling.LANCZOS,centering=(.5,.4))
                  im.save(clean,'WEBP',quality=87,method=6)
              print(f'Clean photo: {clean.name}: {clean.stat().st_size} bytes')
              print(f'{source.name}: {source.stat().st_size} -> {target.stat().st_size} bytes')
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/categories/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized WebP category images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
