name: ShubhLink daily new messages
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: shubhlink-daily-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and publish daily messages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_content.py
      - name: Commit daily content
        run: |
          git config user.name "shubhlink-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-content.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily ShubhLink messages"
            git push
          fi
