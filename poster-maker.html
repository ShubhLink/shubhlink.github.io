<!doctype html><html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f2"><title>My Wishes Poster Maker | ShubhLink</title><meta name="description" content="તમારા નામ અને ફોટા સાથે શુભેચ્છા પોસ્ટર બનાવો, ડાઉનલોડ કરો અને શેર કરો."><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="unified.css?v=15"><link rel="stylesheet" href="poster-maker.css?v=3"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><header class="sitehead"><div class="shell headwrap"><a class="brand" href="index.html"><img src="icon.svg" alt="" width="38" height="38"><span>Shubh<b>Link</b></span></a><nav class="desktopnav"><a href="index.html">હોમ</a><a href="categories.html">કેટેગરી</a><a href="ai.html">AI</a></nav></div></header><main class="poster-main shell"><div class="poster-layout"><div class="poster-preview"><div class="swipe-stage"><button type="button" id="prevDesign" aria-label="પાછલી ડિઝાઇન">‹</button><canvas id="posterCanvas" width="1080" height="1350" aria-label="તમારું શુભેચ્છા પોસ્ટર"></canvas><button type="button" id="nextDesign" aria-label="આગળની ડિઝાઇન">›</button></div><p id="designCounter" class="design-counter">Design 1 / 10 · ડાબે કે જમણે Swipe કરો</p><div class="poster-actions"><button type="button" id="downloadPoster">⬇ PNG Download</button><button type="button" id="sharePoster">↗ Share Poster</button><button type="button" id="newPoster" class="secondary">↻ બીજો મેસેજ</button></div><p id="posterStatus" role="status" aria-live="polite"></p></div><div class="poster-editor"><div class="poster-tools" role="tablist" aria-label="Poster edit tools"><button type="button" class="active" data-panel="name" role="tab" aria-selected="true">👤 નામ</button><button type="button" data-panel="photo" role="tab" aria-selected="false">🖼️ ફોટો</button><button type="button" data-panel="text" role="tab" aria-selected="false">✍️ ટેક્સ્ટ</button><button type="button" data-panel="suggest" role="tab" aria-selected="false">✨ સૂચનો</button></div><form class="poster-controls" id="posterForm"><label>કયા પ્રસંગ માટે?<select id="occasion"><option value="morning">🌅 સુપ્રભાત</option><option value="birthday">🎂 જન્મદિવસ</option><option value="night">🌙 શુભરાત્રિ</option><option value="thought">🌷 સુવિચાર</option><option value="festival">🪔 તહેવાર</option></select></label><div class="editor-panel active" data-editor="name"><label>તમારું નામ<input id="sender" maxlength="45" placeholder="તમારું નામ લખો"></label><label>જેને શુભેચ્છા આપવી છે તેનું નામ (વૈકલ્પિક)<input id="recipient" maxlength="45" placeholder="મિત્ર / પરિવારનું નામ"></label></div><div class="editor-panel" data-editor="text"><label>તમારો મેસેજ<textarea id="wishText" rows="3" maxlength="250"></textarea></label></div><div class="editor-panel" data-editor="photo"><label>તમારો ફોટો (વૈકલ્પિક)<input id="photo" type="file" accept="image/*"></label><button type="button" id="removePhoto" class="secondary">ફોટો દૂર કરો</button><p class="privacy-note">ફોટો તમારા મોબાઇલમાં જ Process થાય છે; Server પર Upload થતો નથી.</p></div><div class="editor-panel" data-editor="suggest"><label>કોના માટે મેસેજ છે?<select id="relation"><option value="all">બધા માટે</option><option value="mother">મમ્મી</option><option value="father">પપ્પા</option><option value="friend">મિત્ર</option><option value="partner">જીવનસાથી</option><option value="family">પરિવાર</option></select></label><label>મેસેજનો પ્રકાર<select id="tone"><option value="warm">પ્રેમાળ</option><option value="blessing">આશીર્વાદ</option><option value="short">ટૂંકો અને સુંદર</option></select></label><button type="button" id="suggestMessage">✨ મેસેજ સૂચવો</button><p class="privacy-note">પસંદગી પ્રમાણે તૈયાર મેસેજ સૂચવાશે. તમે પોતે પણ બદલી શકો છો.</p></div></form></div></div></main><script src="poster-art.js?v=1"></script><script src="poster-maker.js?v=5"></script><script src="pwa.js?v=2"></script></body></html>
